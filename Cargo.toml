[package]
name = "libre-ai-ecosystem-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "EUPL-1.2"
repository = "https://github.com/libre-ai/libre-ai"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
jsonschema = { version = "=0.47.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
biscuit-auth = { version = "=5.0.0", default-features = false }
biscuit-parser = "=0.2.0"
wit-parser = { version = "=0.253.0", default-features = false, features = ["std"] }

[workspace]
